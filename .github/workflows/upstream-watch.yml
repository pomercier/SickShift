name: SickShift - Sync SickGear (alerte conflits seulement)

on:
  schedule:
    - cron: '37 5 * * *'  # Tous les jours, 05:37 UTC
  workflow_dispatch:

concurrency:
  group: sickshift-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Fusion + controles (sans jeton de publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.merge.outputs.ready }}
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Installer dependances de validation (Dashboard + FFmpeg)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dashboard.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            for src in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$src" ]; then
                sudo sed -i -E 's|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$src"
              fi
            done
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends ffmpeg
          fi
      - name: Recuperer et fusionner toutes les modifications SickGear
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/auto_sync_sickgear.py prepare
      - name: Exporter le commit valide (sans code execute apres)
        if: steps.merge.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
          retention-days: 1
          if-no-files-found: error
      - name: Signaler le conflit et declencher l'alerte email GitHub
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error title=Arbitrage requis::Conflit Git avec SickGear necessitant un arbitrage manuel. Voir l'issue ouverte sur le depot."
          echo "# ⚠️ Arbitrage requis : Conflit avec SickGear" >> $GITHUB_STEP_SUMMARY
          echo "Un conflit Git nécessite une résolution manuelle sur votre machine locale." >> $GITHUB_STEP_SUMMARY
          echo "Consultez l'issue créée automatiquement sur GitHub pour les instructions." >> $GITHUB_STEP_SUMMARY
          exit 1

  publish:
    name: Publication protegee de main
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
      - name: Publier exactement le commit teste, sans force-push
        env:
          SICKSHIFT_PUSH_TOKEN: ${{ secrets.SICKSHIFT_SYNC_TOKEN }}
        run: python3 scripts/auto_sync_sickgear.py publish

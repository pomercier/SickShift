name: SickShift - Sync SickGear (alerte conflits seulement)

on:
  schedule:
    - cron: '37 5 * * *'  # Tous les jours, 05:37 UTC
  workflow_dispatch:

concurrency:
  group: sickshift-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Fusion + controles (sans jeton de publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.merge.outputs.ready }}
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recuperer et fusionner toutes les modifications SickGear
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_sync_sickgear.py prepare
      - name: Exporter le commit valide (sans code execute apres)
        if: steps.merge.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publication protegee de main
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
      - name: Publier exactement le commit teste, sans force-push
        env:
          SICKSHIFT_PUSH_TOKEN: ${{ secrets.SICKSHIFT_SYNC_TOKEN }}
        run: python3 scripts/auto_sync_sickgear.py publish

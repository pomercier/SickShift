name: SickShift Upstream Sync

on:
  schedule:
    - cron: '*/15 * * * *'  # Lightweight upstream check every 15 minutes
  workflow_dispatch:

concurrency:
  group: sickshift-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect upstream SickGear changes
    if: github.repository == 'pomercier/SickShift'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needs_sync: ${{ steps.check.outputs.needs_sync }}
      behind: ${{ steps.check.outputs.behind }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare SickShift/main with SickGear/main
        id: check
        run: python3 scripts/auto_sync_sickgear.py detect

  prepare:
    name: Merge and validate upstream (no publishing credentials)
    needs: detect
    if: needs.detect.outputs.needs_sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      ready: ${{ steps.merge.outputs.ready }}
      conflict: ${{ steps.merge.outputs.conflict }}
      release_impact: ${{ steps.merge.outputs.release_impact }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies (Dashboard + FFmpeg)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dashboard.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            for src in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$src" ]; then
                sudo sed -i -E 's|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$src"
              fi
            done
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends ffmpeg
          fi
      - name: Merge, auto-resolve deterministic conflicts, and validate
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/auto_sync_sickgear.py prepare
      - name: Export validated merge bundle
        if: steps.merge.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
          retention-days: 1
          if-no-files-found: error
      - name: Trigger GitHub failure email on human arbitration conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error title=Arbitration Required::Human decision required to merge upstream SickGear changes. Reply /approve on the open GitHub issue."
          echo "# Arbitration Required" >> "$GITHUB_STEP_SUMMARY"
          echo "A semantic merge conflict with upstream SickGear requires your decision." >> "$GITHUB_STEP_SUMMARY"
          echo "Open the issue titled \`[ACTION REQUIRED] SickShift synchronization — decision needed\` and reply \`/approve\` (or \`/choose A|B|C\`)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  publish:
    name: Publish validated merge to main
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sickshift-integration-bundle
          path: ${{ runner.temp }}/sickshift-merge/
      - name: Push exact validated commit to main and verify 0 behind
        env:
          SICKSHIFT_PUSH_TOKEN: ${{ secrets.SICKSHIFT_SYNC_TOKEN }}
        run: python3 scripts/auto_sync_sickgear.py publish

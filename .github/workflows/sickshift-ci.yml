name: SickShift release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verifier FFmpeg (installation seulement si absent)
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # Evite les miroirs cloud (Azure/EC2) qui peuvent brider apt sur les runners Ubuntu.
            for src in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              if [ -f "$src" ]; then
                sudo sed -i -E 's|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$src"
              fi
            done
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version
      - run: python -m pip install -r requirements.txt -r requirements-dashboard.txt
      - run: python scripts/check_release.py
      - run: python -m compileall -q sickshift sickshift_dashboard
      - run: python -m unittest tests.preview_clip_tests tests.release_privacy_tests tests.bootstrap_dependencies_tests tests.preview_availability_tests tests.workflow_policy_tests tests.network_logo_tests tests.dashboard_health_tests tests.frontend_sanity_tests tests.db_backup_tests tests.sync_pipeline_tests -v
      - name: Verify package imports
        run: PYTHONPATH=lib:. python -c "import sickshift; import sickshift_dashboard"

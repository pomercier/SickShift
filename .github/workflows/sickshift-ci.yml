name: SickShift release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-dashboard.txt
      - run: python scripts/check_release.py
      - run: python -m compileall -q sickshift sickshift_dashboard
      - run: python -m unittest tests.preview_clip_tests tests.release_privacy_tests -v
      - name: Verify package imports
        run: PYTHONPATH=lib:. python -c "import sickshift; import sickshift_dashboard"

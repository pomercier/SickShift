services:
  sickshift:
    image: ghcr.io/pomercier/sickshift:latest
    container_name: sickshift
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - TZ=America/Toronto
      - SICKSHIFT_PREVIEW_CACHE_MAX_MB=500
    volumes:
      - ./data:/data
      - ./shows:/shows
